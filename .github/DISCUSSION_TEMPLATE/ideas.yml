title: '[Feature] '
labels: []
body:
  - type: markdown
    attributes:
      value: |-
        誰のどの問題を解決するかと、提案・代替案・互換性を共有してください。
        導入・利用・開発方法は [README](https://github.com/roflsunriz/vpass-revanced/blob/HEAD/README.md) を確認してください。
        本文と添付に秘密情報や個人情報を含めないでください。脆弱性の詳細は公開せず、[セキュリティ方針](https://github.com/roflsunriz/vpass-revanced/blob/HEAD/SECURITY.md) を確認してください。
  - type: textarea
    id: problem
    attributes:
      label: 解決したい問題
      description: 現在の利用場面、困っていること、対象の利用者を説明してください。
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 提案する解決方法
      description: 提案と利用者への効果を具体的に記載してください。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 代替案と互換性
      description: 試した回避策、既存の設定・保存データ・利用者への影響を記載してください。
  - type: textarea
    id: additional
    attributes:
      label: 補足
      description: 参考URL、画面案、関連Issueなど。
  - type: checkboxes
    id: privacy
    attributes:
      label: 公開情報の確認
      options:
        - label: 本文・ログ・画像・添付から、認証情報、Cookie、トークン、秘密鍵、個人情報を除いたことを確認しました。
          required: true
