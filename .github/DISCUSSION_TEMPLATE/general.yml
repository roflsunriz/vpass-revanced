title: '[雑談] '
labels: []
body:
  - type: markdown
    attributes:
      value: |-
        共有や相談の背景を説明してください。使い方の質問や機能提案は、対応する受付を選んでください。
        導入・利用・開発方法は [README](https://github.com/roflsunriz/vpass-revanced/blob/HEAD/README.md) を確認してください。
        本文と添付に秘密情報や個人情報を含めないでください。脆弱性の詳細は公開せず、[セキュリティ方針](https://github.com/roflsunriz/vpass-revanced/blob/HEAD/SECURITY.md) を確認してください。
  - type: textarea
    id: topic
    attributes:
      label: 話題
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: 補足
      description: 関連する背景、参考URLなど。
  - type: checkboxes
    id: privacy
    attributes:
      label: 公開情報の確認
      options:
        - label: 本文・ログ・画像・添付から、認証情報、Cookie、トークン、秘密鍵、個人情報を除いたことを確認しました。
          required: true
