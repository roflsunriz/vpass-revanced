title: '[質問] '
labels: []
body:
  - type: markdown
    attributes:
      value: |-
        実現したいこと、確認・試行したこと、環境を共有してください。再現可能な不具合はIssueの不具合報告へお願いします。
        導入・利用・開発方法は [README](https://github.com/roflsunriz/vpass-revanced/blob/HEAD/README.md) を確認してください。
        本文と添付に秘密情報や個人情報を含めないでください。脆弱性の詳細は公開せず、[セキュリティ方針](https://github.com/roflsunriz/vpass-revanced/blob/HEAD/SECURITY.md) を確認してください。
  - type: textarea
    id: question
    attributes:
      label: 質問
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: 確認・試行したこと
      description: 読んだ文書、試した設定、エラーを秘密情報を除いて記載してください。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 対象環境
      description: OS、アプリ・ツール・端末の版、導入方法。
  - type: textarea
    id: additional
    attributes:
      label: 補足
  - type: checkboxes
    id: privacy
    attributes:
      label: 公開情報の確認
      options:
        - label: 本文・ログ・画像・添付から、認証情報、Cookie、トークン、秘密鍵、個人情報を除いたことを確認しました。
          required: true
