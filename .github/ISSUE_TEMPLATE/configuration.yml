name: 設定・互換性の相談
description: 端末、版、設定、互換性について相談します
title: '[Config] '
labels:
  - configuration
body:
  - type: markdown
    attributes:
      value: |-
        設定・適用方法と、期待した結果・実際の結果を共有してください。
        導入・利用・開発方法は [README](https://github.com/roflsunriz/vpass-revanced/blob/HEAD/README.md) を確認してください。
        本文と添付に秘密情報や個人情報を含めないでください。脆弱性の詳細は公開せず、[セキュリティ方針](https://github.com/roflsunriz/vpass-revanced/blob/HEAD/SECURITY.md) を確認してください。
  - type: checkboxes
    id: preflight
    attributes:
      label: 事前確認
      options:
        - label: 同じ内容の既存Issueを検索しました。
          required: true
        - label: READMEと関連する利用・更新手順を確認しました。
          required: true
  - type: input
    id: environment
    attributes:
      label: 端末・Android・CPU・Vpass アプリ版
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: 確認したい内容
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: 確認・試行したこと
      description: 読んだ文書、変更した設定、試した手順を秘密情報を除いて記載してください。
    validations:
      required: true
  - type: textarea
    id: expected-result
    attributes:
      label: 期待した結果
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: 補足
  - type: checkboxes
    id: privacy
    attributes:
      label: 公開情報の確認
      options:
        - label: 本文・ログ・画像・添付から、認証情報、Cookie、トークン、秘密鍵、個人情報を除いたことを確認しました。
          required: true
