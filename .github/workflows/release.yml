name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: read
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -LiteralPath gradle.properties -Pattern '^version\s*=\s*(.+)$').Matches[0].Groups[1].Value.Trim()
          if ('${{ github.ref_name }}' -ne "v$version") { throw "Tag ${{ github.ref_name }} does not match v$version" }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build, lint and test
        env:
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew clean test build :patches:buildAndroid
      - name: Prepare release assets and notes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $bundles = @(Get-ChildItem patches/build/libs/patches-*.rvp | Where-Object Name -NotMatch 'sources|javadoc')
          if ($bundles.Count -ne 1) { throw "Expected one release RVP, found $($bundles.Count)" }
          ./scripts/verify-android-rvp.ps1 -Path $bundles[0].FullName
          Copy-Item -LiteralPath $bundles[0].FullName -Destination dist/vpass-patches.rvp
          ./scripts/generate-patches-json.ps1 -Version '${{ steps.version.outputs.version }}' -OutputPath dist/patches.json
          ./scripts/extract-changelog.ps1 -Version '${{ steps.version.outputs.version }}' -OutputPath dist/release-notes.md
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/vpass-patches.rvp
            dist/patches.json
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "v${{ steps.version.outputs.version }}"
          dist/vpass-patches.rvp
          dist/patches.json
          --verify-tag
          --title "v${{ steps.version.outputs.version }}"
          --notes-file dist/release-notes.md

      - name: Publish patches.json to the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_PATH: dist/patches.json
        shell: bash
        run: |
          set -euo pipefail
          latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          if [[ "$latest_tag" != "$GITHUB_REF_NAME" ]]; then
            echo "Skipping manifest update for a release that is not the latest."
            exit 0
          fi
          jq -e --arg version "${GITHUB_REF_NAME#v}" \
            '(.version | ltrimstr("v")) == $version and
             (.download_url | type == "string") and
             (.created_at | type == "string") and
             (.description | type == "string")' "$MANIFEST_PATH" >/dev/null
          branch="$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)"
          git fetch --no-tags origin "$branch"
          sha="$(git ls-tree FETCH_HEAD -- patches.json | awk '{print $3}')"
          jq -n --arg branch "$branch" --arg sha "$sha" \
            --rawfile manifest "$MANIFEST_PATH" \
            '{branch: $branch,
              message: "chore(release): 配布用patches.jsonを更新",
              content: ($manifest | @base64)} +
             (if $sha == "" then {} else {sha: $sha} end)' > manifest-update.json
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$GITHUB_REF_NAME"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/patches.json" \
            --input manifest-update.json
